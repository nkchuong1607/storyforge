openapi: 3.1.0
info:
  title: StoryForge API
  version: 0.8.0-phase8-slice1
  description: |
    Phase 8 Slice 1 contract — extends Phase 6 with scene engine structure fields,
    scene_structure / relationship_arc / stakes continuity categories, relationship ledger + graph,
    stakes ledger + act board, and progressive context packs.

    Phase 1–7 routes remain authoritative in prior phase OpenAPI files except where
    **SceneBeat** schema is extended here (goal, conflict, outcome, stakes_level, pressure_tags,
    pov_character_id, scene_type).

    **Auth (MVP stub):** Send `X-User-Id: <uuid>` on every request except `/health`.

    **Canon rule:** Relationship history and stakes checkpoints commit on settle via approved state_diff.
    Graph UI is read-only derived from settled events.

    **LLM:** Optional scene auditor stub — FakeLLM default when enabled in tests.
servers:
  - url: http://localhost:8000
    description: Local API dev
tags:
  - name: Health
  - name: Chapters
  - name: SceneEngine
  - name: Relationships
  - name: Stakes
  - name: Context
  - name: Continuity
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Health check
      security: []
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /projects/{project_id}/scene-engine/settings:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/UserIdHeader"
    get:
      tags: [SceneEngine]
      operationId: getSceneEngineSettings
      summary: Get scene engine settings for project
      responses:
        "200":
          description: Settings row (created with defaults if missing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SceneEngineSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [SceneEngine]
      operationId: updateSceneEngineSettings
      summary: Update scene engine settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SceneEngineSettingsUpdateRequest"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SceneEngineSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /projects/{project_id}/chapters/{chapter_id}/scene-lint:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ChapterId"
      - $ref: "#/components/parameters/UserIdHeader"
    post:
      tags: [SceneEngine]
      operationId: runSceneLint
      summary: Run deterministic scene structure lint (no continuity report persist)
      responses:
        "200":
          description: Lint result for chapter beats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SceneLintResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{project_id}/chapters/{chapter_id}/beats:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ChapterId"
      - $ref: "#/components/parameters/UserIdHeader"
    get:
      tags: [Chapters]
      operationId: listSceneBeatsPhase8
      summary: List scene beats (Phase 8 extended schema)
      responses:
        "200":
          description: Beats ordered by sort_order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SceneBeatListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Chapters]
      operationId: createSceneBeatPhase8
      summary: Create scene beat with structure fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SceneBeatCreateRequest"
      responses:
        "201":
          description: Beat created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SceneBeat"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /projects/{project_id}/chapters/{chapter_id}/beats/{beat_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ChapterId"
      - $ref: "#/components/parameters/BeatId"
      - $ref: "#/components/parameters/UserIdHeader"
    patch:
      tags: [Chapters]
      operationId: updateSceneBeatPhase8
      summary: Update scene beat including goal/conflict/outcome
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SceneBeatUpdateRequest"
      responses:
        "200":
          description: Updated beat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SceneBeat"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /projects/{project_id}/relationships:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/UserIdHeader"
    get:
      tags: [Relationships]
      operationId: listRelationships
      summary: List relationship registry with latest settled intensity
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: character_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter edges touching this character
      responses:
        "200":
          description: Paginated relationships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Relationships]
      operationId: createRelationship
      summary: Register canonical character pair relationship
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelationshipCreateRequest"
      responses:
        "201":
          description: Relationship created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Relationship"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Duplicate pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /projects/{project_id}/relationships/graph:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/UserIdHeader"
    get:
      tags: [Relationships]
      operationId: getRelationshipGraph
      summary: Graph read model (nodes + edges from settled events)
      parameters:
        - name: character_ids
          in: query
          schema:
            type: array
            items:
              type: string
              format: uuid
          style: form
          explode: true
        - name: act_number
          in: query
          schema:
            type: integer
            minimum: 1
        - name: min_intensity
          in: query
          schema:
            type: integer
            minimum: -5
            maximum: 5
        - name: relation_types
          in: query
          schema:
            type: array
            items:
              $ref: "#/components/schemas/RelationType"
          style: form
          explode: true
      responses:
        "200":
          description: Graph payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipGraphResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{project_id}/relationships/{relationship_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/RelationshipId"
      - $ref: "#/components/parameters/UserIdHeader"
    get:
      tags: [Relationships]
      operationId: getRelationship
      summary: Get relationship detail
      responses:
        "200":
          description: Relationship with latest intensity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Relationship"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Relationships]
      operationId: updateRelationship
      summary: Update relationship metadata (not event history)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelationshipUpdateRequest"
      responses:
        "200":
          description: Updated relationship
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Relationship"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Relationships]
      operationId: deleteRelationship
      summary: Delete relationship (blocked if settled events exist)
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Has settled events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{project_id}/relationships/{relationship_id}/events:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/RelationshipId"
      - $ref: "#/components/parameters/UserIdHeader"
    get:
      tags: [Relationships]
      operationId: listRelationshipEvents
      summary: Settled relationship event timeline
      parameters:
        - name: include_draft
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Events ordered by chapter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipEventListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{project_id}/stakes/settings:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/UserIdHeader"
    get:
      tags: [Stakes]
      operationId: getStakesSettings
      summary: Get act structure settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActStructureSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Stakes]
      operationId: updateStakesSettings
      summary: Update act structure settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActStructureSettingsUpdateRequest"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActStructureSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /projects/{project_id}/stakes/entries:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/UserIdHeader"
    get:
      tags: [Stakes]
      operationId: listStakesEntries
      summary: List stakes ledger entries
      parameters:
        - name: act_number
          in: query
          schema:
            type: integer
            minimum: 1
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/StakesEntryStatus"
      responses:
        "200":
          description: Entry list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StakesEntryListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Stakes]
      operationId: createStakesEntry
      summary: Create stakes checkpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StakesEntryCreateRequest"
      responses:
        "201":
          description: Entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StakesLedgerEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /projects/{project_id}/stakes/entries/{entry_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/StakesEntryId"
      - $ref: "#/components/parameters/UserIdHeader"
    get:
      tags: [Stakes]
      operationId: getStakesEntry
      summary: Get stakes checkpoint
      responses:
        "200":
          description: Entry detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StakesLedgerEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Stakes]
      operationId: updateStakesEntry
      summary: Update stakes checkpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StakesEntryUpdateRequest"
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StakesLedgerEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Stakes]
      operationId: deleteStakesEntry
      summary: Delete planned checkpoint only
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Entry not in planned status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{project_id}/stakes/board:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/UserIdHeader"
    get:
      tags: [Stakes]
      operationId: getStakesBoard
      summary: Act-grouped board view with escalation warnings
      parameters:
        - name: act_number
          in: query
          schema:
            type: integer
            minimum: 1
          description: Highlight single act column
      responses:
        "200":
          description: Board columns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StakesBoardResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{project_id}/context-packs/scene:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/UserIdHeader"
    post:
      tags: [Context]
      operationId: buildSceneContextPack
      summary: Progressive scene beat structure slice for Writer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SceneContextPackRequest"
      responses:
        "200":
          description: Beat structure slice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SceneContextPackResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{project_id}/context-packs/relationships:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/UserIdHeader"
    post:
      tags: [Context]
      operationId: buildRelationshipsContextPack
      summary: Progressive relationship slice for scene cast
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelationshipsContextPackRequest"
      responses:
        "200":
          description: Edge slice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipsContextPackResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{project_id}/context-packs/stakes:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/UserIdHeader"
    post:
      tags: [Context]
      operationId: buildStakesContextPack
      summary: Progressive stakes slice for current act/chapter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StakesContextPackRequest"
      responses:
        "200":
          description: Act stakes slice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StakesContextPackResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    UserIdHeader:
      name: X-User-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChapterId:
      name: chapter_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BeatId:
      name: beat_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RelationshipId:
      name: relationship_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StakesEntryId:
      name: entry_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    Unauthorized:
      description: Missing or invalid X-User-Id
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found or cross-tenant
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict with current state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    ContinuitySeverity:
      type: string
      enum: [pass, warn, fail]

    ContinuityCategory:
      type: string
      description: Phase 8 extends Phase 6 enum with scene_structure, relationship_arc, stakes
      enum:
        - character
        - timeline
        - location
        - world_rule
        - bible_staging
        - foreshadow
        - psychology
        - power_system
        - scene_structure
        - relationship_arc
        - stakes

    ContinuityIssue:
      type: object
      required: [fingerprint, severity, category, code, message]
      properties:
        fingerprint:
          type: string
        severity:
          $ref: "#/components/schemas/ContinuitySeverity"
        category:
          $ref: "#/components/schemas/ContinuityCategory"
        code:
          type: string
        message:
          type: string
        chapter_refs:
          type: array
          items:
            type: integer
        entity_ids:
          type: array
          items:
            type: string
            format: uuid
        evidence:
          type: object
          additionalProperties: true

    SceneType:
      type: string
      enum: [scene, sequel, transition, exposition]

    PressureTag:
      type: object
      required: [tag]
      properties:
        tag:
          type: string
        source:
          type: string
        weight:
          type: integer
          minimum: 0
          default: 1

    SceneBeat:
      type: object
      required:
        - id
        - project_id
        - chapter_id
        - beat_key
        - summary
        - sort_order
        - completed
        - goal
        - conflict
        - outcome
        - pressure_tags
        - scene_type
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        chapter_id:
          type: string
          format: uuid
        beat_key:
          type: string
        summary:
          type: string
        sort_order:
          type: integer
        completed:
          type: boolean
        goal:
          type: string
        conflict:
          type: string
        outcome:
          type: string
        stakes_level:
          type: integer
          minimum: 0
          maximum: 5
          nullable: true
        pressure_tags:
          type: array
          items:
            $ref: "#/components/schemas/PressureTag"
        pov_character_id:
          type: string
          format: uuid
          nullable: true
        scene_type:
          $ref: "#/components/schemas/SceneType"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SceneBeatCreateRequest:
      type: object
      required: [beat_key, summary, sort_order]
      properties:
        beat_key:
          type: string
        summary:
          type: string
        sort_order:
          type: integer
          minimum: 0
        completed:
          type: boolean
          default: false
        goal:
          type: string
        conflict:
          type: string
        outcome:
          type: string
        stakes_level:
          type: integer
          minimum: 0
          maximum: 5
        pressure_tags:
          type: array
          items:
            $ref: "#/components/schemas/PressureTag"
        pov_character_id:
          type: string
          format: uuid
        scene_type:
          $ref: "#/components/schemas/SceneType"

    SceneBeatUpdateRequest:
      type: object
      properties:
        beat_key:
          type: string
        summary:
          type: string
        sort_order:
          type: integer
        completed:
          type: boolean
        goal:
          type: string
        conflict:
          type: string
        outcome:
          type: string
        stakes_level:
          type: integer
          minimum: 0
          maximum: 5
          nullable: true
        pressure_tags:
          type: array
          items:
            $ref: "#/components/schemas/PressureTag"
        pov_character_id:
          type: string
          format: uuid
          nullable: true
        scene_type:
          $ref: "#/components/schemas/SceneType"

    SceneBeatListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SceneBeat"

    SceneEngineSettings:
      type: object
      required:
        - project_id
        - enabled
        - require_conflict
        - require_outcome_on_complete
        - min_goal_length
        - llm_auditor_enabled
        - strictness
        - updated_at
      properties:
        project_id:
          type: string
          format: uuid
        enabled:
          type: boolean
        require_conflict:
          type: boolean
        require_outcome_on_complete:
          type: boolean
        min_goal_length:
          type: integer
        llm_auditor_enabled:
          type: boolean
        strictness:
          type: string
          enum: [relaxed, standard, strict]
        updated_at:
          type: string
          format: date-time

    SceneEngineSettingsUpdateRequest:
      type: object
      properties:
        enabled:
          type: boolean
        require_conflict:
          type: boolean
        require_outcome_on_complete:
          type: boolean
        min_goal_length:
          type: integer
          minimum: 1
        llm_auditor_enabled:
          type: boolean
        strictness:
          type: string
          enum: [relaxed, standard, strict]

    SceneLintStats:
      type: object
      required: [fail, warn, pass]
      properties:
        fail:
          type: integer
        warn:
          type: integer
        pass:
          type: integer

    SceneLintResponse:
