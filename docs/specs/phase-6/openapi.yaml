components:
  securitySchemes:
    UserIdHeader:
      type: apiKey
      in: header
      name: X-User-Id
      description: MVP stub auth — UUID of acting user
  security:
  - UserIdHeader: []
  parameters:
    UserIdHeader:
      name: X-User-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Required on all routes except /health
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EntryId:
      name: entry_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BibleVersion:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 0
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    RankId:
      name: rank_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TechniqueId:
      name: technique_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChapterId:
      name: chapter_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BeatId:
      name: beat_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProseVersion:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ReportId:
      name: report_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CharacterId:
      name: character_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProvisionalId:
      name: provisional_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Idempotent settle — duplicate key returns cached success
    TwistId:
      name: twist_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlantId:
      name: plant_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PayoffId:
      name: payoff_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AudienceQuery:
      name: audience
      in: query
      schema:
        type: string
        enum:
        - author
        - writer
        default: author
      description: writer strips secret_truth from twist responses
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid X-User-Id
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found or not accessible
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    PowerSystemSettings:
      type: object
      required: [project_id, enabled, priority_gap, max_rank_jump_per_chapter, require_breakthrough_event, updated_at]
      properties:
        project_id:
          type: string
          format: uuid
        enabled:
          type: boolean
        priority_gap:
          type: integer
          minimum: 1
          maximum: 10
        max_rank_jump_per_chapter:
          type: integer
          minimum: 0
          maximum: 5
        require_breakthrough_event:
          type: boolean
        updated_at:
          type: string
          format: date-time
    PowerSystemSettingsUpdate:
      type: object
      properties:
        enabled:
          type: boolean
        priority_gap:
          type: integer
          minimum: 1
          maximum: 10
        max_rank_jump_per_chapter:
          type: integer
          minimum: 0
          maximum: 5
        require_breakthrough_event:
          type: boolean
    PowerRankSubStage:
      type: object
      required: [key, display_name, sort_order]
      properties:
        key:
          type: string
        display_name:
          type: string
        sort_order:
          type: integer
    PowerRank:
      type: object
      required: [id, rank_key, display_name, sort_order, sub_stages]
      properties:
        id:
          type: string
          format: uuid
        rank_key:
          type: string
        display_name:
          type: string
        sort_order:
          type: integer
        sub_stages:
          type: array
          items:
            $ref: '#/components/schemas/PowerRankSubStage'
        constraints_md:
          type: string
    PowerRankListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PowerRank'
    PowerRankCreateRequest:
      type: object
      required: [rank_key, display_name]
      properties:
        rank_key:
          type: string
        display_name:
          type: string
        sort_order:
          type: integer
        sub_stages:
          type: array
          items:
            $ref: '#/components/schemas/PowerRankSubStage'
        constraints_md:
          type: string
    PowerRankUpdateRequest:
      type: object
      properties:
        rank_key:
          type: string
        display_name:
          type: string
        sort_order:
          type: integer
        sub_stages:
          type: array
          items:
            $ref: '#/components/schemas/PowerRankSubStage'
        constraints_md:
          type: string
    PowerRankReorderRequest:
      type: object
      required: [rank_ids]
      properties:
        rank_ids:
          type: array
          items:
            type: string
            format: uuid
    PowerTechnique:
      type: object
      required: [id, technique_key, display_name, min_rank_id, resource_cost]
      properties:
        id:
          type: string
          format: uuid
        technique_key:
          type: string
        display_name:
          type: string
        min_rank_id:
          type: string
          format: uuid
        min_rank_display_name:
          type: string
        sect_requirement:
          type: string
          nullable: true
        lineage_requirement:
          type: string
          nullable: true
        resource_cost:
          type: object
          additionalProperties: true
        notes_md:
          type: string
    PowerTechniqueListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PowerTechnique'
    PowerTechniqueCreateRequest:
      type: object
      required: [technique_key, display_name, min_rank_id]
      properties:
        technique_key:
          type: string
        display_name:
          type: string
        min_rank_id:
          type: string
          format: uuid
        sect_requirement:
          type: string
        lineage_requirement:
          type: string
        resource_cost:
          type: object
          additionalProperties: true
        notes_md:
          type: string
    PowerTechniqueUpdateRequest:
      type: object
      properties:
        technique_key:
          type: string
        display_name:
          type: string
        min_rank_id:
          type: string
          format: uuid
        sect_requirement:
          type: string
          nullable: true
        lineage_requirement:
          type: string
          nullable: true
        resource_cost:
          type: object
          additionalProperties: true
        notes_md:
          type: string
    GenreRulePack:
      type: object
      additionalProperties: true
      description: See docs/specs/phase-6/genre-contracts.md
    GenreRulePackResponse:
      type: object
      required: [project_id, genre_profile, pack, updated_at]
      properties:
        project_id:
          type: string
          format: uuid
        genre_profile:
          $ref: '#/components/schemas/GenreProfile'
        pack:
          $ref: '#/components/schemas/GenreRulePack'
        updated_at:
          type: string
          format: date-time
    GenreRulePackPatch:
      type: object
      properties:
        pack:
          $ref: '#/components/schemas/GenreRulePack'
    PromptEditTurn:
      type: object
      required: [id, turn_index, instruction, model, provider, created_at]
      properties:
        id:
          type: string
          format: uuid
        turn_index:
          type: integer
        instruction:
          type: string
        proposed_content:
          type: string
          nullable: true
        model:
          type: string
        provider:
          type: string
          enum: [fake, litellm]
        latency_ms:
          type: integer
          nullable: true
        token_usage:
          type: object
          additionalProperties: true
        error_code:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    PromptEditInstructRequest:
      type: object
      required: [instruction]
      properties:
        instruction:
          type: string
          maxLength: 4000
        base_prose_version:
          type: integer
          minimum: 1
        beat_key:
          type: string
    PromptEditInstructResponse:
      type: object
      required: [session_id, turn, base_prose_version]
      properties:
        session_id:
          type: string
          format: uuid
        turn:
          $ref: '#/components/schemas/PromptEditTurn'
        base_prose_version:
          type: integer
    PromptEditRegenerateRequest:
      type: object
      required: [session_id, turn_id]
      properties:
        session_id:
          type: string
          format: uuid
        turn_id:
          type: string
          format: uuid
    PromptEditApplyRequest:
      type: object
      required: [session_id, turn_id]
      properties:
        session_id:
          type: string
          format: uuid
        turn_id:
          type: string
          format: uuid
    PromptEditApplyResponse:
      type: object
      required: [prose_version, chapter]
      properties:
        prose_version:
          $ref: '#/components/schemas/ProseVersionDetail'
        chapter:
          type: object
          properties:
            current_prose_version:
              type: integer
            word_count:
              type: integer
    PromptEditSessionSummary:
      type: object
      required: [id, status, base_prose_version, turns, created_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, applied, discarded]
        base_prose_version:
          type: integer
        turns:
          type: array
          items:
            $ref: '#/components/schemas/PromptEditTurn'
        created_at:
          type: string
          format: date-time
    PromptEditSessionListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PromptEditSessionSummary'

    HealthResponse:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: Stable machine-readable code
              examples:
              - validation_error
              - not_found
              - slug_conflict
              - unauthorized
              - not_implemented
            message:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: true
    PaginationMeta:
      type: object
      required:
      - page
      - page_size
      - total_items
      - total_pages
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total_items:
          type: integer
        total_pages:
          type: integer
    ProjectStatus:
      type: string
      enum:
      - active
      - archived
    ProjectLanguage:
      type: string
      enum:
      - vi
      - en
      - mixed
    GenreProfile:
      type: string
      enum:
      - xianxia
      - mystery
      - literary
      - romance
      - custom
    ProjectTemplate:
      type: string
      enum:
      - blank
      - xianxia_starter
      - mystery_starter
    BibleSection:
      type: string
      enum:
      - world_rules
      - locations
      - factions
      - glossary
      - timeline
      - characters
      - objects
    ChapterStatus:
      type: string
      enum:
      - planned
      - drafting
      - reviewing
      - settled
      - locked
    ProjectSummary:
      type: object
      required:
      - id
      - slug
      - title
      - genre_profile
      - status
      - bible_version_current
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        language:
          $ref: '#/components/schemas/ProjectLanguage'
        genre_profile:
          $ref: '#/components/schemas/GenreProfile'
        template:
          $ref: '#/components/schemas/ProjectTemplate'
        status:
          $ref: '#/components/schemas/ProjectStatus'
        bible_version_current:
          type: integer
        progress_percent:
          type: integer
          minimum: 0
          maximum: 100
          description: Stub 0 in Phase 1 until chapter metrics exist
        updated_at:
          type: string
          format: date-time
    ProjectDetail:
      allOf:
      - $ref: '#/components/schemas/ProjectSummary'
      - type: object
        required:
        - created_by
