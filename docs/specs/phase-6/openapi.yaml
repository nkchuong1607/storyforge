openapi: 3.1.0
info:
  title: StoryForge API
  version: 0.7.0-phase6
  description: 'Phase 6 contract — extends Phase 5 with power system staging CRUD, cultivation ledger on settle,
    power_system continuity category, genre rule pack GET/PATCH, and Prompt Edit (LiteLLM via env; FakeLLM default for tests).
    Phase 5 psych routes retained.


    **Auth (MVP stub):** Send `X-User-Id: <uuid>` on every request except `/health`.


    **Canon rule:** Bible edits write to staging only. `bible_versions` snapshots are immutable. Settle via `POST .../chapters/{chapter_id}/settle`.
    Cultivation changes commit via approved state_diff ledger proposals. Prompt Edit Apply creates prose_versions with source=ai_editor only.
    **LLM:** Default STORYFORGE_LLM_PROVIDER=fake (FakeLLM); set litellm for real models (server-side keys only).'
servers:
- url: http://localhost:8000
  description: Local API dev
tags:
- name: Health
- name: Projects
- name: Bible
- name: Chapters
- name: Characters
- name: Provisional
- name: Extraction
- name: Context
- name: Continuity
- name: Settle
- name: Twists
- name: Psychology
- name: PowerSystem
- name: Genre
- name: PromptEdit
paths:
  /health:
    get:
      tags:
      - Health
      operationId: getHealth
      summary: Health check
      security: []
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /projects:
    get:
      tags:
      - Projects
      operationId: listProjects
      summary: List projects for current user
      parameters:
      - $ref: '#/components/parameters/UserIdHeader'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/ProjectStatus'
        description: Default `active` (excludes archived)
      - name: q
        in: query
        schema:
          type: string
        description: Case-insensitive title search
      responses:
        '200':
          description: Paginated project list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Projects
      operationId: createProject
      summary: Create project (wizard submit)
      parameters:
      - $ref: '#/components/parameters/UserIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
      responses:
        '201':
          description: Project created with bible v0 seed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Slug conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /projects/{project_id}:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    - $ref: '#/components/parameters/UserIdHeader'
    get:
      tags:
      - Projects
      operationId: getProject
      summary: Get project detail
      responses:
        '200':
          description: Project detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Projects
      operationId: updateProject
      summary: Update project metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateRequest'
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Projects
      operationId: archiveProject
      summary: Archive project (soft delete)
      responses:
        '204':
          description: Project archived
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/bible/entries:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    - $ref: '#/components/parameters/UserIdHeader'
    get:
      tags:
      - Bible
      operationId: listBibleEntries
      summary: List bible staging entries
      parameters:
      - name: section
        in: query
        schema:
          $ref: '#/components/schemas/BibleSection'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Staging entries for project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BibleEntryListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Bible
      operationId: createBibleEntry
      summary: Create staging bible entry
      description: 'Writes to `bible_entry_staging` only. Does not mutate `bible_versions`.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BibleEntryCreateRequest'
      responses:
        '201':
          description: Entry created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BibleEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: entry_key already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /projects/{project_id}/bible/entries/{entry_id}:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    - $ref: '#/components/parameters/EntryId'
    - $ref: '#/components/parameters/UserIdHeader'
    get:
      tags:
      - Bible
      operationId: getBibleEntry
      summary: Get staging bible entry by id
      responses:
        '200':
          description: Staging entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BibleEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Bible
      operationId: updateBibleEntry
      summary: Update staging bible entry
      description: 'Updates staging content only. Never updates settled `bible_versions.snapshot_json`.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BibleEntryUpdateRequest'
      responses:
        '200':
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BibleEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Bible
      operationId: deleteBibleEntry
      summary: Delete staging bible entry
      responses:
        '204':
          description: Entry deleted from staging
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/bible/versions:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    - $ref: '#/components/parameters/UserIdHeader'
    get:
      tags:
      - Bible
      operationId: listBibleVersions
      summary: List settled bible versions (metadata)
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Version list (newest first)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BibleVersionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/bible/versions/{version}:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    - $ref: '#/components/parameters/BibleVersion'
    - $ref: '#/components/parameters/UserIdHeader'
    get:
      tags:
      - Bible
      operationId: getBibleVersion
      summary: Get immutable bible snapshot
      responses:
        '200':
          description: Full snapshot at version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BibleVersionDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/chapters:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    - $ref: '#/components/parameters/UserIdHeader'
    get:
      tags:
      - Chapters
      operationId: listChapters
      summary: List chapter metadata
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Chapters ordered by number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Chapters
      operationId: createChapter
      summary: Create stub chapter (optional Phase 1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChapterCreateRequest'
      responses:
        '201':
          description: Chapter created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chapter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Chapter number conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /projects/{project_id}/chapters/{chapter_id}:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    - $ref: '#/components/parameters/ChapterId'
    - $ref: '#/components/parameters/UserIdHeader'
    get:
      tags:
      - Chapters
      operationId: getChapter
      summary: Get chapter detail
      responses:
        '200':
          description: Chapter detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chapter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Chapters
      operationId: updateChapter
      summary: Update chapter title or status
      description: 'Valid status transitions per Phase 2 schema. Locked chapters reject mutations with 409.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChapterUpdateRequest'
      responses:
        '200':
          description: Updated chapter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chapter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Locked chapter or invalid transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /projects/{project_id}/chapters/{chapter_id}/beats:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    - $ref: '#/components/parameters/ChapterId'
    - $ref: '#/components/parameters/UserIdHeader'
    get:
      tags:
      - Chapters
      operationId: listSceneBeats
      summary: List scene beats for chapter
      responses:
        '200':
          description: Beats ordered by sort_order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SceneBeatListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Chapters
      operationId: createSceneBeat
      summary: Create scene beat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SceneBeatCreateRequest'
      responses:
        '201':
          description: Beat created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SceneBeat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Locked chapter or beat_key conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /projects/{project_id}/chapters/{chapter_id}/beats/{beat_id}:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    - $ref: '#/components/parameters/ChapterId'
    - $ref: '#/components/parameters/BeatId'
    - $ref: '#/components/parameters/UserIdHeader'
    patch:
      tags:
      - Chapters
      operationId: updateSceneBeat
      summary: Update scene beat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SceneBeatUpdateRequest'
      responses:
        '200':
          description: Updated beat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SceneBeat'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Locked chapter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Chapters
      operationId: deleteSceneBeat
      summary: Delete scene beat
      responses:
        '204':
          description: Beat deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Locked chapter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /projects/{project_id}/chapters/{chapter_id}/prose-versions:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    - $ref: '#/components/parameters/ChapterId'
    - $ref: '#/components/parameters/UserIdHeader'
    get:
      tags:
      - Chapters
      operationId: listProseVersions
      summary: List prose version metadata
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Versions newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProseVersionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Chapters
      operationId: createProseVersion
      summary: Save new prose version (human)
      description: 'Append-only insert. Updates chapter word_count and may transition planned → drafting.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProseVersionCreateRequest'
      responses:
        '201':
          description: Version saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProseVersionDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Locked chapter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /projects/{project_id}/chapters/{chapter_id}/prose-versions/compare:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    - $ref: '#/components/parameters/ChapterId'
    - $ref: '#/components/parameters/UserIdHeader'
    - name: from
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
    - name: to
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
    get:
      tags:
      - Chapters
      operationId: compareProseVersions
      summary: Compare prose version metadata
      responses:
        '200':
          description: Metadata diff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProseVersionCompareResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/chapters/{chapter_id}/prose-versions/{version}:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    - $ref: '#/components/parameters/ChapterId'
    - $ref: '#/components/parameters/ProseVersion'
    - $ref: '#/components/parameters/UserIdHeader'
    get:
      tags:
      - Chapters
      operationId: getProseVersion
      summary: Get full prose version content
      responses:
        '200':
          description: Prose version with content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProseVersionDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/chapters/{chapter_id}/continuity-check:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    - $ref: '#/components/parameters/ChapterId'
    - $ref: '#/components/parameters/UserIdHeader'
    post:
      tags:
      - Continuity
      operationId: runContinuityCheck
      summary: Run deterministic continuity check (sync)
      description: Persists `continuity_reports` row. Runs Phase 2 deterministic rules plus Phase 4 `foreshadow` category
        (payoff-without-plants, plant-count gates, unseeded reveal). Sets chapter status to `reviewing` when was `drafting`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContinuityCheckRequest'
      responses:
        '200':
          description: Continuity report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContinuityReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Locked chapter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /projects/{project_id}/chapters/{chapter_id}/continuity-reports/latest:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    - $ref: '#/components/parameters/ChapterId'
    - $ref: '#/components/parameters/UserIdHeader'
    get:
      tags:
      - Continuity
      operationId: getLatestContinuityReport
      summary: Get latest continuity report for chapter
      responses:
        '200':
          description: Latest report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContinuityReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/chapters/{chapter_id}/continuity-reports/{report_id}:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    - $ref: '#/components/parameters/ChapterId'
    - $ref: '#/components/parameters/ReportId'
    - $ref: '#/components/parameters/UserIdHeader'
    get:
      tags:
      - Continuity
      operationId: getContinuityReport
      summary: Get continuity report by id
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContinuityReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/chapters/{chapter_id}/continuity-overrides:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    - $ref: '#/components/parameters/ChapterId'
    - $ref: '#/components/parameters/UserIdHeader'
    post:
      tags:
      - Continuity
      operationId: createContinuityOverride
      summary: Mark continuity issue as intentional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContinuityOverrideCreateRequest'
      responses:
        '201':
          description: Override created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContinuityOverride'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/chapters/{chapter_id}/state-diff:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    - $ref: '#/components/parameters/ChapterId'
    - $ref: '#/components/parameters/UserIdHeader'
    - name: prose_version
      in: query
      schema:
        type: integer
        minimum: 1
    get:
      tags:
      - Continuity
      operationId: getStateDiff
      summary: Get state diff preview for chapter
      responses:
        '200':
          description: State diff preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateDiff'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/chapters/{chapter_id}/settle:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    - $ref: '#/components/parameters/ChapterId'
    - $ref: '#/components/parameters/UserIdHeader'
    - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags:
      - Settle
      operationId: settleChapter
      summary: Settle chapter (atomic ledger + bible version++)
      description: 'Atomic transaction: append ledger_events, INSERT bible_versions N+1 from staging merge,

        bump projects.bible_version_current, reconcile staging, lock chapter.

        FAIL continuity blocks settle unless overridden.

        '
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettleChapterRequest'
      responses:
        '200':
          description: Chapter settled and locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettleChapterResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: FAIL blocks settle, invalid status, or locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Missing continuity report or approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /projects/{project_id}/characters:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    - $ref: '#/components/parameters/UserIdHeader'
    get:
      tags:
      - Characters
      operationId: listCharacters
      summary: List characters with tier and status filters
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: tier
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 3
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/CharacterStatus'
        description: Default excludes archived unless explicitly requested
      - name: q
        in: query
        schema:
          type: string
        description: Filter display_name / aliases (case-insensitive prefix)
      responses:
        '200':
          description: Characters ordered by tier DESC, display_name ASC
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Characters
      operationId: createCharacter
      summary: Create established character (manual seed)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharacterCreateRequest'
      responses:
        '201':
          description: Character created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Character'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Duplicate display_name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /projects/{project_id}/characters/search:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    - $ref: '#/components/parameters/UserIdHeader'
    get:
      tags:
      - Characters
      operationId: searchCharacters
      summary: Alias-aware name search (keyword v1)
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      - name: search_mode
        in: query
        schema:
          type: string
          enum:
          - keyword
          - vector
          default: keyword
        description: vector requires pgvector stub populated; keyword is canonical Phase 3
      responses:
        '200':
          description: Ranked character matches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterSearchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
