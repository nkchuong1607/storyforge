name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install API dependencies
        run: |
          cd apps/api
          python -m venv .venv
          . .venv/bin/activate
          pip install -U pip
          pip install -e ".[dev]"

      - name: Install web dependencies
        run: |
          cd apps/web
          npm install

      - name: Agent preflight
        run: bash scripts/harness/agent-preflight.sh

      - name: Harness check
        run: bash scripts/harness/check.sh
